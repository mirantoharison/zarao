[package]
name = "zarao"
version = "2.0.0"
description = "Lecteur de médias malagasy"
edition = "2021"

[lib]
name = "zarao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Édition « local » : le backend Node est lancé en ZARAO_ROLE=local (voir lib.rs).
local-edition = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
